name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]     # Pillow 9.0 and 10.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil cups-client cups-ppdc shellcheck
      - name: shellcheck
        run: shellcheck -S warning install.sh tools/fetch-icc.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: PPD check
        run: cupstestppd ppd/epson-scf100-sublimation.ppd
      - name: Installer help and version
        run: |
          ./install.sh --version
          LANG=de_DE.UTF-8 ./install.sh -h >/dev/null
          LANG=C ./install.sh -h >/dev/null
